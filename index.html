<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI-werk van de laatste tijd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: iO-geïnspireerd. Witte pagina, crème banden, een hero in een afgeronde kader met bewegende blauwe lijn,
   grote cases in twee kolommen, en per case een scrollende case-pagina (hash-routes). */
:root{
  /* measured: Figma iO Website 2026 variables + iodigital.com computed styles */
  --bg:#FFFFFF; --band:#F2E9E4; --soft:#F7F2EF; --ink:#232323; --muted:#5E5E5E; --faint:#949494; --line:#E3DAD4;
  --blue:#0000D2; --on-blue:#FFFFFF; --pill:#232323; --on-pill:#FFFFFF; --shade:rgba(0,0,0,.05);
  --font:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r-xl:24px; --r-lg:24px; --r-md:16px;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand svg{height:30px;width:auto;display:block;color:var(--ink)}
.brand span{font-size:14px;font-weight:600;color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
.brand span{color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;gap:6px}
.nav a{text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px}
.nav a:hover{background:var(--soft)}
.nav a.cta{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding:9px 18px}
.nav a.cta:hover{background:var(--ink);color:#fff}
@media (max-width:640px){.nav a.hide-s{display:none}.brand span{display:none}}

/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--on-blue);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
.display{font-size:clamp(40px,6.4vw,88px);font-weight:400;line-height:1.02;letter-spacing:-.03em}
.h2{font-size:clamp(30px,4.2vw,56px);font-weight:400;line-height:1.06}
.h3{font-size:clamp(22px,2.2vw,28px);font-weight:600;line-height:1.2;letter-spacing:-.015em}
.lead{font-size:clamp(17px,1.5vw,20px);color:var(--muted);max-width:60ch;margin:0}
.blue{color:var(--blue)}
p{margin:0}
b,strong{font-weight:700}

/* blocks glide in (start visible, only move) */
@media (prefers-reduced-motion:no-preference){.glide{transform:translateY(28px);transition:transform 1s cubic-bezier(.2,.7,.1,1)}.glide.in{transform:none}}
/* scroll colour reveal: words start muted (readable) and turn ink */
.rv .w{color:var(--faint);transition:color .5s ease}
.rv.on .w{color:inherit}
.rv.on .w.blue,.rv .w.blue{}
.rv.on .w.bl{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.rv .w{color:inherit!important;transition:none}.rv .w.bl{color:var(--blue)!important}}

/* hero: full-bleed photo in a rounded frame, white type (iO website 2026) */
.wrap-wide{max-width:1480px;margin:0 auto}
.hero{padding-block:12px 0}
.frame{position:relative;border-radius:var(--r-xl);overflow:hidden;background:#232323;min-height:min(86vh,820px);display:flex;align-items:flex-end;max-width:100%;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 30%;z-index:-2;transform:scale(1.06)}
@media (prefers-reduced-motion:no-preference){.hero-img{animation:kb 18s ease-out both}@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.04)}}}
.frame::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(20,20,22,.82) 0%,rgba(20,20,22,.55) 45%,rgba(20,20,22,.05) 80%),linear-gradient(0deg,rgba(20,20,22,.55),transparent 45%)}
.hero-copy{position:relative;padding:clamp(24px,5vw,72px);display:flex;flex-direction:column;align-items:flex-start;gap:24px;max-width:980px;color:#fff}
.hero-copy .lead{color:rgba(255,255,255,.86);max-width:52ch}
.hero-title{font-size:clamp(44px,7.4vw,112px);font-weight:300;letter-spacing:-.035em;line-height:.98}
.hero-title .w{display:inline-block}
@media (prefers-reduced-motion:no-preference){.hero-title .w{animation:rise 1s cubic-bezier(.2,.7,.1,1) both}@keyframes rise{from{transform:translateY(.4em);opacity:.12}to{transform:none;opacity:1}}}
.pill-glass{background:rgba(255,255,255,.14);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.scrollcue{position:absolute;right:clamp(20px,4vw,48px);bottom:clamp(20px,4vw,48px);color:#fff;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl;display:flex;align-items:center;gap:12px;opacity:.8}
.scrollcue::after{content:"";width:1px;height:56px;background:linear-gradient(#fff,transparent)}
@media (max-width:640px){.scrollcue{display:none}}

/* spotlight: Antonissen on dark */
.spot{padding-block:clamp(16px,2vw,24px) 0}
.spot .wrap{background:#232323;color:#fff;border-radius:var(--r-xl);padding:clamp(28px,5vw,72px);max-width:1480px}
.spot-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:40px 72px;align-items:center}
@media (max-width:900px){.spot-grid{grid-template-columns:1fr}}
.spot-copy{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.spot .lead{color:rgba(255,255,255,.78)}
.spot .rv .w{color:rgba(255,255,255,.35)}.spot .rv.on .w{color:#fff}.spot .rv.on .w.bl{color:#8C8CFF}
.eyebrow-w{color:#8C8CFF}
.spot-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.spot-flow li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.14);position:relative}
.spot-flow li .n{font-size:13px;font-weight:700;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.spot-flow li b{font-size:clamp(18px,1.8vw,22px);font-weight:500}
.spot-flow li > span:last-child{font-size:14px;color:rgba(255,255,255,.6);text-align:right}
.spot-flow li::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#6B6BFF;transform:scaleX(0);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
  .spot-flow li::before{animation:sweep 7.2s linear infinite;animation-delay:calc(var(--i)*1.2s)}
  .spot-flow li .n{animation:lit 7.2s linear infinite;animation-delay:calc(var(--i)*1.2s)}
  @keyframes sweep{0%{transform:scaleX(0)}14%{transform:scaleX(1)}20%,100%{transform:scaleX(1);opacity:0}}
  @keyframes lit{0%,16%{color:#8C8CFF}20%,100%{color:rgba(255,255,255,.5)}}
}
@media (max-width:480px){.spot-flow li{grid-template-columns:36px minmax(0,1fr)}.spot-flow li > span:last-child{grid-column:2;text-align:left}}

/* flow graphic card (Antonissen) */
.gfx-flow{background:#232323;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3.4vw,40px);gap:24px}
.gf-steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.gf-steps span{font-size:clamp(12px,1.1vw,14px);font-weight:600;padding:8px 14px;border-radius:100px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);white-space:nowrap}
.gf-steps i{width:14px;height:1px;background:rgba(255,255,255,.4)}
@media (prefers-reduced-motion:no-preference){.gf-steps span{animation:chip 7s ease-in-out infinite;animation-delay:calc(var(--i)*.7s)}@keyframes chip{0%,8%{background:#0000D2;box-shadow:inset 0 0 0 1px #0000D2}14%,100%{background:transparent}}}
.gf-k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8C8CFF}
.gf-foot{display:flex;flex-direction:column;gap:10px}
.gf-big{font-size:clamp(28px,3.6vw,52px);font-weight:300;line-height:1.05;letter-spacing:-.03em}
.gf-big b{font-weight:500;color:#fff}
.tags-row{position:absolute;left:16px;top:16px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.pill-dark{background:#232323}

.btn{display:inline-flex;align-items:center;gap:10px;font:600 16px/24px var(--font);text-decoration:none;border:0;cursor:pointer;border-radius:100px;padding:13px 24px;min-height:50px;background:var(--pill);color:var(--on-pill);transition:background .2s,color .2s,box-shadow .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.white{background:#fff;color:var(--ink)}.btn.white:hover{background:var(--blue);color:#fff}
.btn.outw{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}.btn.outw:hover{background:#fff;color:var(--ink)}
.arrow{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:100px;border:1px solid var(--blue);color:var(--blue);flex:none;transition:background .2s,color .2s}
.arrow svg{width:24px;height:24px}
a:hover .arrow{background:var(--blue);color:var(--on-blue)}

.namepill{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;font-size:clamp(18px,1.8vw,22px);font-weight:600;letter-spacing:-.01em;padding:10px 20px 10px 14px;border-radius:100px;background:var(--blue);color:#fff}
.namepill i{width:10px;height:10px;border-radius:50%;background:#fff;flex:none}
@media (prefers-reduced-motion:no-preference){.namepill i{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}}
.namepill.dark{margin-top:-8px}
/* n8n drawing */
.n8n{background:#1C1C20;border-radius:var(--r-lg);overflow:hidden;color:#fff;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.n8n-bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(28,28,32,.9);font-size:14px}
.n8n-bar b{font-weight:600}.n8n-bar > span:last-child{margin-left:auto;color:rgba(255,255,255,.55);font-size:12px}
.n8n-dots{display:flex;gap:6px}.n8n-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.n8n-scroll{overflow-x:auto;padding:18px 8px 8px}
.n8n svg{display:block;width:100%;min-width:900px;height:auto}
.nf-e{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2}
.nf-flow{fill:none;stroke:#8C8CFF;stroke-width:2;stroke-dasharray:4 14;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.nf-flow{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-18}}}
.nf-dot{fill:#1C1C20;stroke:rgba(255,255,255,.5);stroke-width:2}
.nf-box{fill:#2B2B31;stroke:rgba(255,255,255,.22);stroke-width:1.5;transition:stroke .2s}
.nf-n:hover .nf-box,.nf-n:focus .nf-box{stroke:#8C8CFF}
.nf-n:focus{outline:none}
.nf-g{fill:#fff;font:700 15px Manrope,Arial,sans-serif;text-anchor:middle}
.nf-t{fill:#fff;font:600 14px Manrope,Arial,sans-serif;text-anchor:middle}
.nf-s{fill:rgba(255,255,255,.55);font:500 12px Manrope,Arial,sans-serif;text-anchor:middle}
.nf-lab{fill:#8C8CFF;font:600 12px Manrope,Arial,sans-serif;text-anchor:middle}
.nf-trig{fill:none;stroke:#FF6D5A;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spot-diagram{grid-column:1/-1;margin-top:8px;min-width:0}
.spot-grid > *{min-width:0}
/* themes row */
.themes{padding-block:clamp(40px,5vw,72px) clamp(16px,2vw,24px)}
.themes-head{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.themes-head .h3{font-size:clamp(26px,3vw,40px);font-weight:400;letter-spacing:-.025em}
.theme-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1240px){.theme-row{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.theme-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.theme{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--band);border-radius:var(--r-lg);padding:10px 10px 16px;min-width:0;transition:transform .25s ease,background .25s}
.theme:hover{transform:translateY(-4px);background:#EADFD8}
.th-pic{display:block;position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#232323;margin-bottom:8px;max-width:100%}
.th-pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.theme:hover .th-pic img{transform:scale(1.06)}
.th-pic .gfx{position:absolute;inset:0;padding:12px}
.th-mini{justify-content:flex-end!important;gap:6px!important}.th-mini .gf-big{font-size:clamp(18px,1.6vw,24px)!important;white-space:nowrap}.th-pic .gf-steps{gap:4px}.th-pic .gf-steps span{font-size:10px;padding:4px 8px}.th-pic .gf-steps i{width:6px}
.th-pic .gf-big{font-size:clamp(15px,1.3vw,18px)}
.th-pic .gfx-blue .big{font-size:clamp(28px,3vw,40px)}.th-pic .gfx-blue .small{display:none}
.th-no,.theme b,.th-sub,.th-foot{padding-inline:6px}
.th-no{font-size:12px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.theme b{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.th-sub{font-size:14px;color:var(--muted);flex:1}
.th-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:600;color:var(--muted)}
.th-foot .arrow{width:34px;height:34px}.th-foot .arrow svg{width:20px;height:20px}
.theme:hover .arrow{background:var(--blue);color:#fff}
/* visits calendar (Secret Santa) */
.visits{display:flex;flex-direction:column;gap:18px}
.vrow{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:16px 28px;align-items:center;background:var(--soft);border-radius:var(--r-lg);padding:20px 22px}
.blk.band .vrow{background:var(--bg)}
.vrow.after{background:#232323;color:#fff}
.vk{display:flex;flex-direction:column;gap:4px}.vk b{font-size:20px;font-weight:600}.vk span{font-size:14px;color:var(--muted)}
.vrow.after .vk span{color:rgba(255,255,255,.7)}
.vdays{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:6px}
.vdays li{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint)}
.vrow.after .vdays li{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:rgba(255,255,255,.4)}
.vdays li.on{background:var(--blue);color:#fff;box-shadow:none}
@media (prefers-reduced-motion:no-preference){.rvb .vrow.after .vdays li.on{transition:background .3s ease,color .3s ease;transition-delay:calc(var(--n)*55ms)}.rvb:not(.on) .vrow.after .vdays li.on{background:transparent;color:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}}
.vnote{font-size:13px;color:var(--muted)}
@media (max-width:760px){.vrow{grid-template-columns:1fr}.vdays{grid-template-columns:repeat(12,minmax(0,1fr))}}
/* market comparison */
.mkt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.mkt{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.mkt{grid-template-columns:1fr}}
.mkt-i{background:var(--bg);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.blk:not(.band) .mkt-i{background:var(--soft)}
.mkt-i .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.mkt-i b{font-size:clamp(26px,2.6vw,36px);font-weight:300;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.mkt-i .d{font-size:14px;color:var(--muted);flex:1}
.mkt-i .src{font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;padding-top:10px;border-top:1px solid var(--line)}
.mkt-i a.src:hover{color:var(--blue)}
.mkt-calc{margin-top:16px;background:var(--pill);color:#fff;border-radius:var(--r-md);padding:18px 24px;font-size:17px}
.mkt-ours{margin-top:12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:17px}
.mkt-ours .namepill{font-size:15px;padding:8px 16px 8px 12px}
.mkt-ours p{flex:1 1 320px}
/* sections */
.sec{padding-block:clamp(64px,9vw,128px)}
.sec.band{background:var(--band)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:clamp(32px,5vw,56px)}
.sec-head > *{min-width:0}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}

/* facts */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.fact{padding:28px 24px 28px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);min-width:0}
.fact + .fact{padding-left:24px;border-left:1px solid var(--line)}
.fact b{font-size:clamp(44px,5vw,72px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:15px}
.fact{text-decoration:none;color:inherit;transition:background .2s}
.fact:hover{background:var(--soft)}
.fact em{font-style:normal;font-size:13px;font-weight:700;color:var(--blue);margin-top:auto}
@media (max-width:900px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){padding-left:0;border-left:0}}
@media (max-width:480px){.facts{grid-template-columns:1fr}.fact,.fact + .fact{padding-left:0;border-left:0}}

/* marquee */
.marq{overflow:hidden;background:var(--band);padding-block:30px;border-block:1px solid var(--line)}
.marq-track{display:flex;gap:56px;width:max-content;animation:marq 40s linear infinite}
.marq-track span{font-size:clamp(22px,2.6vw,34px);font-weight:600;letter-spacing:-.02em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:56px}
.marq-track span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq-track{animation:none;flex-wrap:wrap;width:auto;padding-inline:16px;gap:16px 32px}.marq-track span::after{display:none}}
.marq:hover .marq-track{animation-play-state:paused}

/* case grid */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:600 14px var(--font);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--soft);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 28px}
@media (max-width:760px){.cases{grid-template-columns:1fr}}
.case{text-decoration:none;display:flex;flex-direction:column;gap:18px;min-width:0}
.case .pic{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1;max-width:100%;background:var(--band)}
.case .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.case:hover .pic img,.case:hover .pic .gfx{transform:scale(1.04)}

.case .pic .gfx{position:absolute;inset:0;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.case .cap{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.case .cap h3{font-size:clamp(20px,2vw,25px);font-weight:600;line-height:1.22;letter-spacing:-.015em}
.case .cap p{color:var(--muted);margin-top:8px;font-size:15px}
.case[hidden]{display:none}
@media (min-width:761px){.cases.odd .case.feat{grid-column:1/-1}.cases.odd .case.feat .pic{aspect-ratio:21/9}}

/* typographic graphics for cases without photos */
.gfx-blue{background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,4vw,40px)}
.gfx-blue .big{font-size:clamp(64px,11vw,148px);font-weight:500;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.gfx-blue .small{font-size:15px;opacity:.85;margin-top:12px;font-weight:600}
.gfx-blue svg{position:absolute;right:-8%;top:-6%;width:70%;opacity:.9}
.gfx-cream{background:var(--band);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:clamp(20px,4vw,40px)}

/* live list */
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.live a{display:flex;flex-direction:column;gap:6px;padding:20px 22px;border-radius:var(--r-md);background:var(--bg);text-decoration:none;min-width:0;position:relative;transition:transform .2s ease}
.live a:hover{transform:translateY(-2px)}
.live a b{font-size:17px;font-weight:700;padding-right:48px}
.live a span{color:var(--muted);font-size:14px}
.live a em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.live a .arrow{position:absolute;right:16px;top:16px;width:36px;height:36px}

footer.foot{background:#232323;color:rgba(255,255,255,.7);padding-block:clamp(48px,7vw,96px) 40px;margin-top:clamp(48px,7vw,96px);font-size:14px}
footer.foot .wrap{display:flex;flex-direction:column;gap:56px}
.foot-top{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
footer.foot .sign{font-size:clamp(36px,5vw,72px);color:#fff;font-weight:300;letter-spacing:-.03em;line-height:1}
.foot-bot{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.14);padding-top:24px}
.foot-logo svg{height:28px;width:auto;color:#fff;display:block}

/* ===== case page ===== */
.chead{padding-block:clamp(32px,6vw,72px) clamp(32px,5vw,56px)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:clamp(28px,5vw,56px)}
.back:hover{color:var(--blue)}
.chead .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px 64px;align-items:end}
@media (max-width:860px){.chead .grid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13px;font-weight:600;background:var(--soft);border-radius:999px;padding:6px 12px}
.cover{border-radius:var(--r-xl);overflow:hidden;background:var(--band);aspect-ratio:21/9;max-width:100%;position:relative}
.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:640px){.cover{aspect-ratio:4/3}}

.blk{padding-block:clamp(48px,7vw,96px)}
.blk.band{background:var(--band)}
.blk-head{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(28px,4vw,48px);max-width:900px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 64px;align-items:start}
.split > *{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr}}

.statement{font-size:clamp(28px,3.8vw,52px);font-weight:400;line-height:1.12;letter-spacing:-.025em;max-width:22ch;text-wrap:balance}
.statement-sub{margin-top:24px}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:stretch}
.cmp .c{background:var(--soft);border-radius:var(--r-lg);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:12px;min-width:0}
.blk.band .cmp .c{background:var(--bg)}
.cmp .c.hl{background:var(--blue);color:var(--on-blue)}
.cmp .c.hl .muted{color:rgba(255,255,255,.82)}
.cmp .c .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.cmp .mid{display:grid;place-items:center}
.cmp .mid .arrow{background:var(--bg)}
@media (max-width:760px){.cmp{grid-template-columns:1fr}.cmp .mid{transform:rotate(90deg)}}
.muted{color:var(--muted)}

/* flow */
.flow{border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--blue);padding:clamp(28px,3vw,40px) clamp(16px,3vw,36px) clamp(20px,3vw,36px);position:relative}
.flow-scroll{overflow-x:auto;padding-bottom:4px}
.flow .badge{position:absolute;left:24px;top:0;transform:translateY(-50%);background:var(--bg);padding:2px 10px;line-height:1.2}
.blk.band .flow .badge{background:var(--band)}
.flow ol{list-style:none;margin:0;padding:0;display:flex;align-items:stretch;gap:0;min-width:720px}
.flow li{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;cursor:default}
.flow li .t,.flow li .b{font-size:13px;color:var(--muted);min-height:20px}
.flow li .n{background:var(--pill);color:var(--on-pill);border-radius:12px;padding:16px 10px;font-weight:700;width:calc(100% - 36px);transition:background .2s,transform .2s}
.flow li:hover .n,.flow li:focus-within .n{background:var(--blue);color:var(--on-blue);transform:translateY(-3px)}
.flow li:not(:last-child)::after{content:"";position:absolute;left:calc(100% - 18px);top:50%;width:30px;height:2px;background:var(--blue);transform:translateY(-50%)}
.flow li:not(:last-child)::before{content:"";position:absolute;left:calc(100% + 10px);top:50%;border-style:solid;border-width:6px 0 6px 8px;border-color:transparent transparent transparent var(--blue);transform:translateY(-50%);z-index:1}
.flow-wrap{position:relative}
.scrollhint{display:none;font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:760px){.scrollhint{display:block}}

/* cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--soft);border-radius:var(--r-lg);padding:clamp(20px,2.4vw,28px);display:flex;flex-direction:column;gap:10px;min-width:0}
.blk.band .card{background:var(--bg)}
.card .no{font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.card h4{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.card p{color:var(--muted);font-size:15px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.card .tags span{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.card.hl{background:var(--blue);color:var(--on-blue)}
.card.hl p{color:rgba(255,255,255,.85)}
.card.hl .no{color:#fff}
.card.hl .tags span{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.stat{padding:24px 20px 24px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.stat b{font-size:clamp(40px,4.4vw,64px);font-weight:300;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.stats{grid-template-columns:1fr}}

/* table */
.tbl{overflow-x:auto;border-radius:var(--r-lg);background:var(--soft)}
.blk.band .tbl{background:var(--bg)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
tr.total td{font-weight:700;background:color-mix(in srgb,var(--blue) 8%,transparent)}

/* timing bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:14px;align-items:center}
.bar .l{font-weight:600;font-size:15px}
.bar .l small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.bar .track{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:999px;width:var(--w);transform-origin:left}
@media (prefers-reduced-motion:no-preference){.rvb .fill{transition:width 1s cubic-bezier(.2,.7,.1,1)}.rvb:not(.on) .fill{width:4%!important}}
.bar .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:15px}
.bar.tot .fill{background:var(--pill)}
.axis{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:14px;font-size:12px;color:var(--muted)}
.axis div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar,.axis{grid-template-columns:1fr 70px}.bar .l{grid-column:1/-1}.axis > :first-child{display:none}}

/* figures, videos */
.fig{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.fig .im{border-radius:var(--r-lg);overflow:hidden;background:var(--band);position:relative;max-width:100%}
.fig img{width:100%;height:auto;display:block}
.fig button.zoom{all:unset;cursor:zoom-in;display:block}
.fig button.zoom:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.fig figcaption{font-size:14px;color:var(--muted)}
.fig figcaption b{color:var(--ink)}
.vid{border-radius:var(--r-lg);overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.vid video{width:100%;height:100%;display:block;background:#000}
.figs{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:20px}
@media (max-width:700px){.figs{grid-template-columns:1fr}}

/* video case */
.vcase{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px 48px;align-items:start}
.vcase > *{min-width:0}
@media (max-width:900px){.vcase{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.kv h5{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.kv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.kv li{padding-left:16px;position:relative}
.kv li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.thumbs2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.thumbs2 img{width:100%;border-radius:12px;display:block}

/* before/after */
.ba{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--band);max-width:100%;user-select:none;touch-action:pan-y}
.ba img{display:block;width:100%;height:auto}
.ba .top-img{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p,50%))}
.ba .top-img img{width:100%;height:100%;object-fit:cover}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--p,50%);width:3px;background:var(--blue);transform:translateX(-50%);pointer-events:none}
.ba .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .lab{position:absolute;bottom:14px;z-index:2;background:rgba(10,10,14,.72);color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px;pointer-events:none}
.ba .lab.l{left:14px}.ba .lab.r{right:14px;background:var(--blue)}
.ba-cap{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:14px;color:var(--muted)}
.ba-cap > *{max-width:48%}

/* layers / stack */
.stack{display:flex;flex-direction:column;gap:10px}
.layer{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;background:var(--soft);border-radius:var(--r-md);padding:14px 18px}
.blk.band .layer{background:var(--bg)}
.layer .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.layer .v{display:flex;flex-wrap:wrap;gap:8px}
.layer .v span{background:var(--band);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.blk.band .layer .v span{background:var(--soft)}
.layer.ai .v span:first-child{background:var(--blue);color:#fff}

/* hub diagram */
.hub{display:grid;grid-template-columns:1fr auto 1fr;gap:16px 28px;align-items:center}
.hub .side{display:flex;flex-direction:column;gap:10px}
.hub .side span{background:var(--bg);border-radius:999px;padding:10px 16px;font-weight:600;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.hub .core{width:clamp(150px,18vw,200px);aspect-ratio:1;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;font-weight:700;font-size:18px;padding:20px;box-shadow:0 0 0 14px color-mix(in srgb,var(--blue) 14%,transparent),0 0 0 28px color-mix(in srgb,var(--blue) 7%,transparent)}
.hub .row{grid-column:1/-1;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.hub .row span{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
@media (max-width:640px){.hub{grid-template-columns:1fr}.hub .core{margin:0 auto}}

/* cycle */
.cycle{display:grid;place-items:center;padding-block:12px}
.cycle svg{width:min(100%,560px);height:auto;display:block}

/* numbered list block */
.nlist{list-style:none;margin:0;padding:clamp(22px,3vw,40px);background:var(--blue);color:#fff;border-radius:var(--r-lg);display:flex;flex-direction:column;gap:0}
.nlist li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding-block:16px;border-bottom:1px solid rgba(255,255,255,.22)}
.nlist li:last-child{border-bottom:0}
.nlist .n{font-weight:700;font-variant-numeric:tabular-nums;opacity:.75}
.nlist b{display:block;font-size:18px}
.nlist span{opacity:.85}

/* timeline */
.tline{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;position:relative}
.tline .t{border-top:3px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:6px}
.tline .t.on{border-color:var(--blue)}
.tline .t b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.tline .t.on b{color:var(--blue)}
.tline .t span{color:var(--muted);font-size:15px}
@media (max-width:700px){.tline{grid-template-columns:1fr}}
.banner{margin-top:24px;background:var(--pill);color:var(--on-pill);border-radius:var(--r-md);padding:18px 24px;font-weight:600}
.banner.blue{background:var(--blue);color:#fff}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:var(--r-md);padding:14px 18px;cursor:pointer;font-weight:600;transition:background .2s}
.blk.band .check label{background:var(--bg)}
.check input{appearance:none;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--blue);display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.check input:checked{background:var(--blue)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.progress{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-weight:700;font-variant-numeric:tabular-nums}
.progress .track{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.progress .fill{height:100%;background:var(--blue);width:0;transition:width .3s}

/* template */
pre.tpl{margin:0;font:13px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--pill);color:var(--on-pill);border-radius:var(--r-lg);padding:22px;overflow-x:auto;white-space:pre;max-height:520px}
.tplbar{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.toast{color:var(--blue);font-weight:700;font-size:14px}

/* emotion strip */
.emo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.emo div{background:var(--bg);border-radius:var(--r-lg);padding:22px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.emo i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.emo b{font-size:18px}
.emo span{color:var(--muted);font-size:14px}
@media (max-width:900px){.emo{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.emo{grid-template-columns:1fr}}

/* closing / next */
.next{display:flex;align-items:center;justify-content:space-between;gap:24px;text-decoration:none;padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.next .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.next h3{font-size:clamp(28px,4vw,52px);font-weight:500;line-height:1.05;margin-top:8px}
.next:hover h3{color:var(--blue)}
.closing{background:#232323;color:#fff;border-radius:var(--r-xl);padding:clamp(32px,6vw,88px);position:relative;overflow:hidden;isolation:isolate;text-align:center;display:flex;justify-content:center}
.closing > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:blur(2px) saturate(.8);transform:scale(1.05)}
.closing::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(20,20,22,.72)}
.closing-in{display:flex;flex-direction:column;align-items:center;gap:28px}
.closing .statement{color:#fff;max-width:16ch;font-weight:300;font-size:clamp(36px,5.4vw,76px);line-height:1.02}
.closing .dlwrap{justify-content:center}

/* deck downloads: save through the downloads capability; without it the link opens the PDF */
let DLNS; const dlReady=(window.claude&&claude.use)?claude.use("downloads").then(d=>DLNS=d).catch(()=>DLNS=null):Promise.resolve(DLNS=null);
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-dl]"); if(!a||!DLNS) return;
  e.preventDefault(); const msg=a.parentElement.querySelector(".dlmsg");
  try{ msg.textContent="Bezig…"; const blob=await (await fetch(a.dataset.dl)).blob(); await DLNS.save({filename:a.dataset.name,data:blob}); msg.textContent="Gedownload"; }
  catch(err){ const c=err&&err.code; msg.textContent = c==="declined"?"Download geannuleerd": c==="rate_limited"?"Even wachten en opnieuw proberen":"Download lukt hier niet, de PDF opent in een nieuw tabblad"; if(c&&c!=="declined"&&c!=="rate_limited"){ DLNS=null; } }
  setTimeout(()=>msg.textContent="",3500);
});

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,8,12,.88);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}

/* n8n-style drawing of the Antonissen auto-flow (simplified: based on the flow as described, not an export of the workflow) */
function n8nFlow(){
  const N=[ // id, x, y, glyph, tile colour, title, sub
    ["start",70,190,"B","#0000D2","Start via Bonzai","startlink"],
    ["jira",225,190,"J","#2684FF","Jira-ticket","label auto-flow"],
    ["files",380,190,"SP","#0F7B6C","Bestanden ophalen","Excel, logo, beelden"],
    ["claude",535,190,"AI","#D97757","Claude","leest copy, kiest beeld"],
    ["mail",690,190,"@","#5E5E5E","Mail designer","beelden goedkeuren"],
    ["switch",845,190,"⑂","#8C8CFF","Motion of static?","per ticket"],
    ["krea",1000,95,"K","#232323","Krea","foto's animeren"],
    ["ae",1155,95,"Ae","#2A0B5E","After Effects","template renderen"],
    ["figma",1077,290,"F","#F24E1E","Figma","statics vullen"],
    ["out",1310,190,"SP","#0F7B6C","SharePoint","designer kijkt na"]];
  const P=Object.fromEntries(N.map(n=>[n[0],n]));
  const E=[["start","jira"],["jira","files"],["files","claude"],["claude","mail"],["mail","switch"],["switch","krea","motion"],["krea","ae"],["switch","figma","static"],["ae","out"],["figma","out"]];
  const h=36;
  const edge=([a,b,lab])=>{const A=P[a],B=P[b];const x1=A[1]+h,y1=A[2],x2=B[1]-h,y2=B[2];const mx=(x1+x2)/2;
    return `<path class="nf-e" d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/><path class="nf-flow" d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/><circle cx="${x2}" cy="${y2}" r="4" class="nf-dot"/>${lab?`<text x="${mx}" y="${(y1+y2)/2-8}" class="nf-lab">${lab}</text>`:""}`};
  const node=n=>`<g class="nf-n" tabindex="0" aria-label="${n[5]}: ${n[6]}"><rect x="${n[1]-h}" y="${n[2]-h}" width="${h*2}" height="${h*2}" rx="16" class="nf-box"/><rect x="${n[1]-20}" y="${n[2]-20}" width="40" height="40" rx="10" fill="${n[4]}"/><text x="${n[1]}" y="${n[2]+6}" class="nf-g">${n[3]}</text><text x="${n[1]}" y="${n[2]+h+22}" class="nf-t">${n[5]}</text><text x="${n[1]}" y="${n[2]+h+40}" class="nf-s">${n[6]}</text>${n[0]==="start"?`<path d="M${n[1]-h-14} ${n[2]-8} l10 8 l-10 8" class="nf-trig"/>`:""}</g>`;
  return `<div class="n8n"><div class="n8n-bar"><span class="n8n-dots" aria-hidden="true"><i></i><i></i><i></i></span><b>Antonissen auto-flow</b><span>n8n · vereenvoudigde weergave</span></div><div class="n8n-scroll"><svg viewBox="0 0 1390 390" role="img" aria-label="De Antonissen auto-flow in n8n: start via Bonzai, Jira-ticket, bestanden ophalen, Claude leest copy en kiest beelden, mail naar de designer om goed te keuren, dan motion via Krea en After Effects of statics via Figma, en tot slot alles naar SharePoint.">${E.map(edge).join("")}${N.map(node).join("")}</svg></div></div>`;
}

const app=document.getElementById("app");
let filter="all";
try{const s=localStorage.getItem("ai-filter"); if(FILTERS.some(f=>f[0]===s)) filter=s;}catch(e){}
let raf=0;
function route(){
  
  const h=location.hash.replace(/^#/,""); const c=CASES.find(x=>x.id===h);
  app.innerHTML = c ? renderCase(c) : renderHome();
  document.title = c ? (c.client+" · AI-werk") : "AI-werk van de laatste tijd";
  wire(!!c);
  if(pending){const el=document.getElementById(pending); pending=null; if(el){el.scrollIntoView({block:"start"}); return}}
  window.scrollTo(0,0);
}
let pending=null;
document.addEventListener("click",e=>{
  const th=e.target.closest("[data-theme]");
  if(th){e.preventDefault(); filter=th.dataset.theme; try{localStorage.setItem("ai-filter",filter)}catch(_){} applyFilter(); const el=document.getElementById("cases"); if(el) el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return;}
  const g=e.target.closest("[data-go]"); if(!g) return;
  const id=g.dataset.go; const el=document.getElementById(id);
  if(el && !CASES.some(x=>x.id===location.hash.slice(1))){e.preventDefault(); el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return}
  pending=id; if(location.hash==="#home"||location.hash===""){e.preventDefault(); route();}
});
window.addEventListener("hashchange",route);

function wire(isCase){
  // reveal
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("on");io.unobserve(en.target)}}),{rootMargin:"0px 0px -12% 0px"});
  app.querySelectorAll(".rv,.rvb").forEach(el=>io.observe(el));
  const io2=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io2.unobserve(en.target)}}),{rootMargin:"0px 0px -6% 0px"});
  app.querySelectorAll(".blk .wrap > *:not(.blk-head), .case, .live a, .fact").forEach(el=>{el.classList.add("glide");io2.observe(el)});
  // filters
  app.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.k;try{localStorage.setItem("ai-filter",filter)}catch(e){}applyFilter()}));
  applyFilter();
  // zoom
  app.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>openLb(b.dataset.zoom, b.querySelector("img")?.alt||"")));
  // before/after
  app.querySelectorAll(".ba").forEach(ba=>{const r=ba.querySelector("input");const set=()=>ba.style.setProperty("--p",r.value+"%");r.addEventListener("input",set);set();});
  // copy
  app.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",()=>{
    const pre=btn.closest(".wrap").querySelector("pre.tpl"), toast=btn.parentElement.querySelector(".toast");
    const done=t=>{toast.textContent=t;toast.hidden=false;setTimeout(()=>toast.hidden=true,2200)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);done("Geselecteerd, kopieer met Cmd+C")};
    try{navigator.clipboard.writeText(pre.textContent).then(()=>done("Gekopieerd"),sel)}catch(e){sel()}
  }));
  // checklist
  app.querySelectorAll("[data-check]").forEach(box=>{
    const key="chk-"+box.dataset.check, ins=[...box.querySelectorAll("input")];
    let saved=[]; try{saved=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
    ins.forEach((x,i)=>x.checked=!!saved[i]);
    const upd=()=>{const n=ins.filter(x=>x.checked).length;box.querySelector(".cnt").textContent=n+" / "+ins.length;box.querySelector(".progress .fill").style.width=(n/ins.length*100)+"%";try{localStorage.setItem(key,JSON.stringify(ins.map(x=>x.checked)))}catch(e){}};
    ins.forEach(x=>x.addEventListener("change",upd)); upd();
  });
  // pause other videos when one plays
  app.querySelectorAll("video[controls]").forEach(v=>v.addEventListener("play",()=>app.querySelectorAll("video[controls]").forEach(o=>{if(o!==v)o.pause()})));
}
function applyFilter(){
  app.querySelectorAll(".filters button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===filter)));
  const vis=[...app.querySelectorAll(".case")].filter(a=>{a.hidden= filter!=="all" && !a.dataset.kind.split(" ").includes(filter); a.classList.remove("feat"); return !a.hidden});
  const grid=app.querySelector(".cases"); if(grid){grid.classList.toggle("odd",vis.length%2===1); if(vis[0]) vis[0].classList.add("feat");}
}

/* deck downloads: save through the downloads capability; without it the link opens the PDF */
let DLNS; const dlReady=(window.claude&&claude.use)?claude.use("downloads").then(d=>DLNS=d).catch(()=>DLNS=null):Promise.resolve(DLNS=null);
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-dl]"); if(!a||!DLNS) return;
  e.preventDefault(); const msg=a.parentElement.querySelector(".dlmsg");
  try{ msg.textContent="Bezig…"; const blob=await (await fetch(a.dataset.dl)).blob(); await DLNS.save({filename:a.dataset.name,data:blob}); msg.textContent="Gedownload"; }
  catch(err){ const c=err&&err.code; msg.textContent = c==="declined"?"Download geannuleerd": c==="rate_limited"?"Even wachten en opnieuw proberen":"Download lukt hier niet, de PDF opent in een nieuw tabblad"; if(c&&c!=="declined"&&c!=="rate_limited"){ DLNS=null; } }
  setTimeout(()=>msg.textContent="",3500);
});

/* lightbox */
const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg");
function openLb(src,alt){lbimg.src=src;lbimg.alt=alt;lb.hidden=false;document.getElementById("lbclose").focus()}
function closeLb(){lb.hidden=true;lbimg.removeAttribute("src")}
lb.addEventListener("click",closeLb);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!lb.hidden)closeLb()});

route();
</script>
